events {}

http {
    upstream meteor_app {
        server meteor-app:3000;
    }

    upstream game_server {
        server game-server:8080;
    }

    server {
        listen 80;

        # Route frontend requests to Meteor
        location / {
            proxy_pass http://meteor_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route API requests to Game Server
        location /api/ {
            proxy_pass http://game_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}