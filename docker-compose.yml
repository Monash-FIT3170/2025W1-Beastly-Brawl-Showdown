version: "3.8"

services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  beastlybrawl:
    build:
      context: ./code
      dockerfile: beastly-brawl-showdown/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./code/beastly-brawl-showdown:/app
      - ./code/shared:/app/shared
    environment:
      - MONGO_URL=mongodb://mongo:27017/beastlybrawl
      - ROOT_URL=http://localhost:3000
    depends_on:
      - mongo

  gameserver:
    build:
      context: ./code
      dockerfile: game-server-v2/Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - ./code/game-server-v2:/app
      - ./code/shared:/app/shared
    environment:
      - MONGO_URL=mongodb://mongo:27017/gameserver
    depends_on:
      - mongo

volumes:
  mongo-data:
