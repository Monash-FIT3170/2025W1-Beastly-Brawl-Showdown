services:
  # confirmed to run
  # - `docker ps` gives the right output
  # - `mongosh "mongodb://localhost:27017"` is sucessful
  mongo:
    image: mongo:latest
    container_name: mongo-game_locator
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ""
      MONGO_INITDB_ROOT_PASSWORD: ""
    command: mongod --noauth --tlsMode disabled

  # Check status
  # `dockercompose logs game-server`
  game-server:
    build:
      context: ./code
      dockerfile: ./game-server-v2/Dockerfile
    volumes:
      - ./code/beastly-brawl-showdown/imports/simulator:/app/simulator
    # ports:
    #   - "8080:8080"
    expose:
      - "8080"
    depends_on:
      - mongo
    environment:
      MONGO_URI: "mongodb://mongo:27017/game_server_register"
    # expose:
    #   - "8080"

  meteor-app:
    build:
      context: ./code/beastly-brawl-showdown
    depends_on:
      - game-server
      - mongo
    # ports:
    #   - "3000:3000"
    expose:
      - "3000"
    environment:
      - MONGO_URL=mongodb://mongo:27017/game_server_register
      # - ROOT_URL="http://localhost"
      - ROOT_URL=http://localhost
      - PORT=3000
      - METEOR_DISABLE_OPTIMISTIC_CACHING=1
      - GAME_SERVER_URL=http://game-server:8080
    # expose:
    #   - "3000"

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # TODO move to .config later
    depends_on:
      - meteor-app
      - game-server
    restart: unless-stopped
