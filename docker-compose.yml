services:
# confirmed to run
# - `docker ps` gives the right output
# - `mongosh "mongodb://localhost:27017"` is sucessful
  mongo:
    image: mongo:latest
    container_name: mongo-game_locator
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ""
      MONGO_INITDB_ROOT_PASSWORD: ""
    command: mongod --noauth --tlsMode disabled


# Check status
# `docker compose logs server-locator`
  server-locator:
    build:
      context: ./code
      dockerfile: ./server-locator/Dockerfile
    volumes:
      - ./code/bbs/imports/simulator:/app/simulator
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    environment:
      MONGO_URI: "mongodb://mongo:27017/game_server_registries?tls=false"

# Check status
# `docker compose logs game-server`
  game-server:
    build:
      context: ./code
      dockerfile: ./game-server-v2/Dockerfile
    volumes:
      - ./code/bbs/imports/simulator:/app/simulator
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    environment:
      MONGO_URI: "mongodb://mongo:27017/game_server_registries?tls=false"

# Check status
# `docker compose logs web-app`
  web-app:
    build:
      context: ./code/bbs
    depends_on:
      - game-server
      - mongo
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://mongo:27017/game_server_registries?tls=false
      - ROOT_URL=http://localhost
      - PORT=3000
      - GAME_SERVER_URL=http://game-server:8080

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web-app
      - game-server